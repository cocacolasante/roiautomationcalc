version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blueprint_roi
      POSTGRES_USER: blueprint
      POSTGRES_PASSWORD: blueprint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueprint -d blueprint_roi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./internal/db/migrations:/migrations
    command: >
      sh -c "for f in /migrations/*.sql; do echo \"Running $$f\"; psql postgres://blueprint:blueprint@postgres:5432/blueprint_roi?sslmode=disable -f $$f; done"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://blueprint:blueprint@postgres:5432/blueprint_roi?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    volumes:
      - ./templates:/app/templates

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://blueprint:blueprint@postgres:5432/blueprint_roi?sslmode=disable
      REDIS_URL: redis://redis:6379
    volumes:
      - ./templates:/app/templates

  tool:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./tool:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8080

  admin:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./admin:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5174:5174"
    environment:
      VITE_API_PROXY: http://server:8080

volumes:
  postgres_data:
